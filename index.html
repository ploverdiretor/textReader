<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>深閑の書架 - 読み上げ1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>深閑の書架</h1>
        </header>

        <main class="app-main">
            <!-- テキスト入力エリア -->
            <div class="textbox-wrapper">
                <textarea id="text-input" placeholder="ここに読み上げたい文章を入力してください..."></textarea>
            </div>

            <!-- 右側：キャラクター・コントロール表示エリア -->
            <aside id="character-area">
                <!-- 【分離した上部】キャラクター・設定領域 -->
                <div class="character-top-block">
                    
                    <!-- 【新設】名前と写真をセットにして中央配置するグループ -->
                    <div class="character-profile-group">
                        <!-- 名前（写真のすぐ上に配置） -->
                        <div class="character-name" id="character-name-display">一之瀬 栞（しおり）</div>
                        <!-- 写真 -->
                        <img id="character-thumb" src="shiori.jpg" alt="キャラクター画像">
                    </div>
                    
                    <!-- 設定・変更グループ（下部に固定） -->
                    <div class="settings-bottom-group">
                        <!-- スライダー -->
                        <div class="voice-sliders-block">
                            <div class="slider-group">
                                <label>話速: <span id="speed-value">1.0</span> x</label>
                                <input type="range" id="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0">
                            </div>
                            <div class="slider-group">
                                <label>音量: <span id="volume-value">1.0</span></label>
                                <input type="range" id="volume-slider" min="0.0" max="2.0" step="0.1" value="1.0">
                            </div>
                        </div>
                        <!-- スライダーの下の話者変更ボタン -->
                        <div class="speaker-switch-box">
                            <span id="switch-speaker-btn">如月 穂波 に変更</span>
                        </div>
                    </div>
                </div>

                <!-- 【分離した下部】操作ボタン領域 -->
                <div class="control-buttons-block">
                    <button id="speak-btn">音声を再生する</button>
                    <div class="action-buttons-row">
                        <!-- ★保存ボタンの左側に読み込み用のボタンと隠しinputを新設 -->
                        <input type="file" id="file-loader" accept=".txt" style="display: none;">
                        <button id="load-btn">読み込み</button>
                        <button id="save-btn">保存</button>
                        <button id="clear-btn">クリア</button>
                    </div>
                </div>
            </aside>
        </main>

        <footer class="app-footer">
            <div class="status" id="status-message"></div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
